name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from `git describe`, which needs the
          # tag objects and enough history to reach them.
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting package version to ${VERSION}"
          python -c "import re, pathlib; p = pathlib.Path('src/azure_pim_cli/__init__.py'); p.write_text(re.sub(r'__version__ = \".*\"', f'__version__ = \"${VERSION}\"', p.read_text()))"
          grep __version__ src/azure_pim_cli/__init__.py

      - name: Build distributions
        run: uv build

      - name: Verify built version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built="$(ls dist/*.whl | head -n1 | sed -E 's|.*/azure_pim_cli-([^-]+)-.*|\1|')"
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $GITHUB_REF_NAME produced version $built — refusing to publish"
            exit 1
          fi

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/azure-pim-cli
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
